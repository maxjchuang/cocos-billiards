<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#F7F5EE" stroke="none" opacity="1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="32" font-size="9" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">EIGHT CLUB / DESIGN V2.4</text><text x="1158" y="32" font-size="10" fill="#607466" text-anchor="end" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">2026.11.08 · 设计评审</text><text x="42" y="80" font-size="29" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">T09 V8低位模型观察</text><text x="42" y="108" font-size="12" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">与T01使用同一模型、材质与比例参照。</text><line x1="42" y1="860" x2="1158" y2="860" fill="none" stroke="#D8DED1" opacity="1" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="879" font-size="9" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">横屏 · 统一界面 · 连续自由镜头</text><text x="1158" y="879" font-size="10" fill="#607466" text-anchor="end" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">20</text><rect x="64" y="145" width="1072" height="570" rx="14" fill="#191E18" stroke="none" opacity="1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><defs><clipPath id="clip-1"><polygon points="64,145 1136,145 1136,715 64,715"/></clipPath></defs><g clip-path="url(#clip-1)"><image href="../table-model/aiming.png" x="180.0" y="145.0" width="840.0" height="570.0"/></g><text x="64" y="749" font-size="18" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">T09 V8低位形态</text><text x="64" y="777" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">与T01使用同一模型和光照，检查台呢、鼻口、木帮与球径的关系。白球为57.15mm比例</text><text x="64" y="799" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">参照。游戏相机和球杆沿实际对局参数驱动。</text><text x="620" y="749" font-size="18" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">游戏接入验收</text><text x="620" y="777" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">在母球后方、贴长库、贴短库和角袋附近复核遮挡。镜头观察与瞄准参数分离，实际击球</text><text x="620" y="799" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">仍由220ms触球帧提交。</text></svg>