<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#F7F5EE" stroke="none" opacity="1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="32" font-size="9" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">EIGHT CLUB / DESIGN V2.4</text><text x="1158" y="32" font-size="10" fill="#607466" text-anchor="end" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">2026.11.08 · 设计评审</text><text x="42" y="80" font-size="29" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">T05 材质、灯光与落地感</text><text x="42" y="108" font-size="12" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">V8实际模型材质近景，木纹、皮口与桌裙使用同一母版。</text><line x1="42" y1="860" x2="1158" y2="860" fill="none" stroke="#D8DED1" opacity="1" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="879" font-size="9" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">横屏 · 统一界面 · 连续自由镜头</text><text x="1158" y="879" font-size="10" fill="#607466" text-anchor="end" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">16</text><rect x="64" y="158" width="526" height="500" rx="14" fill="#191E18" stroke="none" opacity="1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><defs><clipPath id="clip-1"><polygon points="64,158 590,158 590,658 64,658"/></clipPath></defs><g clip-path="url(#clip-1)"><image href="../table-model/wood.png" x="64.0" y="229.53571428571428" width="526.0" height="356.92857142857144"/></g><rect x="610" y="158" width="526" height="500" rx="14" fill="#191E18" stroke="none" opacity="1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><defs><clipPath id="clip-2"><polygon points="610,158 1136,158 1136,658 610,658"/></clipPath></defs><g clip-path="url(#clip-2)"><image href="../table-model/skirt.png" x="610.0" y="229.53571428571428" width="526.0" height="356.92857142857144"/></g><text x="327" y="691" font-size="16" fill="#203D30" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">木帮与顺纹UV</text><text x="873" y="691" font-size="16" fill="#203D30" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">皮口外片与桌裙贴合</text><text x="64" y="749" font-size="18" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">T05 材质基准</text><text x="64" y="777" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">V8采用Poly Haven的CC0胡桃木扫描贴图。木帮基材粗糙度0.25、漆层权重0.28，腿身和</text><text x="64" y="799" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">木脚座采用粗糙度0.34的较哑光表面。纹理和署名随派生资源保留。</text><text x="620" y="749" font-size="18" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">表面与灯光迁移</text><text x="620" y="777" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">深棕皮口保持厚度、缝线和柔和边缘，台呢保持细密低反光。Creator固定曝光下逐项对照</text><text x="620" y="799" font-size="13" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">母版，颜色和光泽由实际画面复核。</text></svg>