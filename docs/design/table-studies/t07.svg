<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#F7F5EE" stroke="none" opacity="1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="32" font-size="9" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">EIGHT CLUB / DESIGN V2.4</text><text x="1158" y="32" font-size="10" fill="#607466" text-anchor="end" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">2026.11.08 · 设计评审</text><text x="42" y="80" font-size="29" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">T07 造型与体验验收</text><text x="42" y="108" font-size="12" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">按固定机位、连续帧及参数表逐项评审。</text><line x1="42" y1="860" x2="1158" y2="860" fill="none" stroke="#D8DED1" opacity="1" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="879" font-size="9" fill="#607466" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">横屏 · 统一界面 · 连续自由镜头</text><text x="1158" y="879" font-size="10" fill="#607466" text-anchor="end" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">18</text><text x="64" y="175" font-size="20" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">V01 比例</text><text x="64" y="203" font-size="15" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">整桌与台面按T06尺寸检查模型包围范围；球径57.15mm。T03两图使用同一比例。约140mm只描述整体边带。</text><text x="64" y="299" font-size="20" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">V02 低位形态</text><text x="64" y="327" font-size="15" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">在母球后方低位、贴长库、贴短库和角袋附近四类机位，各能辨认鼻口、包布与木扶手；转折连续且无硬直绿墙。</text><text x="64" y="423" font-size="20" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">V03 袋口连续</text><text x="64" y="451" font-size="15" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">六袋的高位与低位共12组画面；直库、圆弧袋角与袋内侧相切连接，放大400%时轮廓连续。台呢转角、皮口、木扶手和袋内空间连接完整，无透底、悬空接缝或</text><text x="64" y="475" font-size="15" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">可见支撑穿过入口。</text><text x="64" y="547" font-size="20" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">V04 下落与状态</text><text x="64" y="575" font-size="15" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">六袋各检查慢速和高速进球；连续帧中球体尺寸保持，下沉后经实体遮挡再移除。最后一球落白和黑8结果需完成下落再切换；暂停冻结，重开清空。</text><text x="64" y="671" font-size="20" fill="#203D30" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">V05 材质与镜头</text><text x="64" y="699" font-size="15" fill="#395446" text-anchor="start" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">T01高位、母球后低位、角袋和中袋特写四张样板使用同一光照；布、木、皮、金属可辨。绕台与拉远时桌体、桌腿和地面阴影连续呈现。</text></svg>